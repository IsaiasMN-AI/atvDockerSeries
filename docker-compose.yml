services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend_net
    depends_on:
      - php

  php:
    build:
      context: ./frontend
    volumes:
      - ./frontend/src:/var/www/html
    environment:
      API_BASE_URL: ${API_BASE_URL}
    networks:
      - frontend_net
      - backend_net

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./database:/app/database
      - ./models:/app/models
      - ./routes:/app/routes
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - backend_net
      - db_net

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${DB_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db_net

volumes:
  mysql_data:

networks:
  frontend_net:
  backend_net:
  db_net:
    internal: true
